name: vpn_pix

# Common defaults — single anchor merged once per service.
# Compose v2.30+ (yaml v3) no longer allows two `<<:` keys in the same mapping,
# so we collapse `restart` + `logging` into one anchor.
x-defaults: &defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    <<: *defaults
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    <<: *defaults
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  backend:
    <<: *defaults
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      # Broadcast photo uploads (and any other admin-managed media) — must
      # outlive image rebuilds, otherwise photo_path rows point to nothing.
      - backend_var:/app/var
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [internal]

  bot:
    <<: *defaults
    build:
      context: ../bot
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  worker:
    <<: *defaults
    build:
      context: ../worker
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      # Read-only mount of the same broadcast media that the backend writes,
      # so run_broadcast can stream photos to Telegram on the first send.
      - backend_var:/app/var:ro
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]

  admin:
    <<: *defaults
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    environment:
      TZ: ${TZ:-Europe/Moscow}
    networks: [internal]

  nginx:
    <<: *defaults
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
      # Static landing pages (e.g. /how-to-connect → user-facing setup guide).
      # Each subdir under static/ is mounted at /usr/share/nginx/static/<name>
      # and exposed via an explicit ``location`` block in conf.d/00-default.conf.
      - ./nginx/static:/usr/share/nginx/static:ro
    depends_on:
      - backend
      - admin
    networks: [internal]

volumes:
  postgres_data:
  redis_data:
  backend_var:

networks:
  internal:
    driver: bridge
