name: vpn_pix

x-restart: &restart_policy
  restart: unless-stopped

x-logging: &default_logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    <<: *restart_policy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    <<: *default_logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    <<: *restart_policy
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    environment:
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    <<: *default_logging
    networks: [internal]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    <<: *restart_policy
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    <<: *default_logging
    networks: [internal]

  bot:
    build:
      context: ../bot
      dockerfile: Dockerfile
    <<: *restart_policy
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default_logging
    networks: [internal]

  worker:
    build:
      context: ../worker
      dockerfile: Dockerfile
    <<: *restart_policy
    env_file:
      - ../.env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    <<: *default_logging
    networks: [internal]

  admin:
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
        VITE_BASE_PATH: ${VITE_BASE_PATH:-/}
    <<: *restart_policy
    environment:
      TZ: ${TZ:-Europe/Moscow}
    <<: *default_logging
    networks: [internal]

  nginx:
    image: nginx:1.27-alpine
    <<: *restart_policy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - admin
    <<: *default_logging
    networks: [internal]

volumes:
  postgres_data:
  redis_data:

networks:
  internal:
    driver: bridge
