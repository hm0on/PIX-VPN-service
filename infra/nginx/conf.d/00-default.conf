# =====================================================================
# vhost под домен pix-app.xyz
#
# Хосты:
#   pix-app.xyz       — корень: 404. Админка: /<ADMIN_PATH_SLUG>/ (рандомный slug).
#                       API админки:  /<ADMIN_PATH_SLUG>/api/
#   api.pix-app.xyz   — публичный API: только /webhook/* (для платёжных провайдеров)
#   sub.pix-app.xyz   — НЕ обслуживается этим nginx (это API NorthLine)
#
# Slug в location'ах ниже должен совпадать с ADMIN_PATH_SLUG из .env.
# Текущий: vikih5nh
#
# Сертификат (SAN на 2 имени):
#   pix-app.xyz, api.pix-app.xyz
# Файлы: /etc/nginx/ssl/live/pix-app.xyz/{fullchain,privkey}.pem
# =====================================================================

# ----- HTTP: ACME challenge + редирект на HTTPS -----
server {
    listen 80;
    listen [::]:80;
    server_name pix-app.xyz api.pix-app.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ----- HTTP по чужим именам или прямому IP — закрываем без ответа -----
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# ----- pix-app.xyz: корень глухой, админка под slug-prefix -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name pix-app.xyz;

    ssl_certificate     /etc/nginx/ssl/live/pix-app.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/pix-app.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ===== Admin login — особо жёсткий лимит =====
    # Точный путь, поэтому ставим раньше префиксного location'а.
    #
    # Внимание: имя backend резолвится через Docker DNS в рантайме (см. nginx.conf
    # → resolver 127.0.0.11). proxy_pass с переменной не поддерживает URI-форму,
    # поэтому используем rewrite ... break; чтобы переписать URI до /api/...
    location = /vikih5nh/api/admin/auth/login {
        limit_req zone=admin_login burst=2 nodelay;
        set $backend_host backend;
        rewrite ^ /api/admin/auth/login break;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ===== Admin API: /<slug>/api/* → backend /api/* =====
    location /vikih5nh/api/ {
        limit_req zone=admin_api burst=40 nodelay;
        # Срезаем slug-префикс — backend получает чистый /api/...
        set $backend_host backend;
        rewrite ^/vikih5nh/(api/.*)$ /$1 break;
        proxy_pass http://$backend_host:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trace-ID $http_x_trace_id;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;

        # Поддержка SSE (логи/статистика)
        proxy_buffering off;
        proxy_cache off;
    }

    # ===== Admin SPA (статика) =====
    location /vikih5nh/ {
        # Заголовки только для SPA (не для root!), чтобы не светить наружу.
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:;" always;

        # Срезаем /vikih5nh/ — admin nginx получит /<asset>.
        set $admin_host admin;
        rewrite ^/vikih5nh/(.*)$ /$1 break;
        proxy_pass http://$admin_host:80;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # /vikih5nh без trailing slash → редирект на /vikih5nh/ (иначе SPA не подгрузит base).
    location = /vikih5nh {
        return 301 /vikih5nh/;
    }

    # ===== Корень и всё прочее: глухая 404 =====
    # Никаких намёков на админку. Можно заменить на статический landing/редирект на канал.
    location / {
        return 404;
    }
}

# ----- api.pix-app.xyz: webhook'и провайдеров платежей -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.pix-app.xyz;

    ssl_certificate     /etc/nginx/ssl/live/pix-app.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/pix-app.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /webhook/ {
        limit_req zone=webhook burst=200 nodelay;
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location = /health {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000$request_uri;
        access_log off;
    }

    location / {
        return 404;
    }
}

# ----- HTTPS default_server: чужой Host или прямой IP по 443 → 444 -----
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/live/pix-app.xyz/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/pix-app.xyz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    return 444;
}
